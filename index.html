/* Layout: a 1920×1080 "stage" scaled to the window — browser window on the left, story column on the right.

:root {

html, body { height: 100%; }
body {

#stage {

.ridge { position: absolute; left: 0; bottom: 0; width: 1920px; height: 260px; pointer-events: none; opacity: .9; }

.typed { position: absolute; display: flex; align-items: center; padding: 0 13px; font: 400 16px var(--sans); color: #34281e; background: #fffaf2; border-radius: 6px; pointer-events: none; opacity: 0; }

.card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 150px; gap: 26px;

    { ch: 8, page: 'places', url: '/places', focus: { x: 152, y: 360, w: 900, h: 760 }, zoom: 1.1, hl: { x: 146, y: 703, w: 889, h: 374 }, tag: '1786 · Основание Риддера',
      title: 'История <em>места</em>', text: 'Хронология города по опубликованным источникам: основание Риддера, переименование в Лениногорск, открытие музея.' },
    { ch: 8, page: 'explain', url: '/materials/archive-calendar-2024#material-explanation', focus: { x: 152, y: 150, w: 880, h: 540 }, zoom: 1.2, hl: { x: 146, y: 274, w: 892, h: 330 }, tag: 'Сверить с оригиналом',
      title: 'Выдержки <em>и термины</em>', text: 'Точные выдержки из документа и словарь терминов. У каждой выдержки — ссылка на абзац оригинала.' },
    { ch: 8, page: 'explain', url: '/materials/archive-calendar-2024#material-explanation', focus: { x: 152, y: 600, w: 880, h: 300 }, zoom: 1.2, hl: { x: 146, y: 753, w: 892, h: 144 }, tag: 'Причина связи',
      title: 'Связанные <em>материалы</em>', text: 'Рядом с документом — похожие материалы и объяснение, чем они связаны. Источник всегда остаётся доступным для проверки.' },
    { ch: 9, page: 'design', url: '/', focus: { x: 0, y: 0, w: 1440, h: 900 }, zoom: 1,
      title: 'Сдержанная <em>архивная стилистика</em>', text: 'Тематические фотографии, читаемые шрифты, понятная навигация. Компьютер и телефон, светлая и тёмная тема.' },
    { ch: 9, page: 'display', url: '/', focus: { x: 0, y: 0, w: 1440, h: 900 }, zoom: 1.2, hl: { x: 689, y: 62, w: 292, h: 212 }, tag: 'Вид сайта',
      title: 'Удобно <em>каждому</em>', text: 'Светлая и тёмная тема, увеличение текста, адаптивная вёрстка, необязательное обучение «Как пользоваться» и индикаторы загрузки.' },
    { page: 'home', url: '/', focus: { x: 0, y: 0, w: 1440, h: 900 }, zoom: 1, card: 'outro' },
  ];
  const CARDS = {
    intro: '<p class="eyebrow">Masters Hackathon 9.0 · команда ALEteam</p><h1>ALEteam — <em>цифровой архив ВКО</em></h1><p>Найти историю. Открыть источник. Разобраться в документе.</p><p class="hint"><span class="key">→</span> или пробел — дальше</p>',
    outro: '<p class="eyebrow">Государственный архив Восточно-Казахстанской области</p><h1>Рақмет! <em>Спасибо!</em></h1><p>История региона — в документах. Теперь до них один клик.</p><p class="hint">Алимжан · Алинур · Артур</p>',
  };

  const $ = id => document.getElementById(id);
  const stage = $('stage'), view = $('view'), pagesEl = $('pages'), hl = $('hl'), tag = $('tag'), cursor = $('cursor'), story = $('story'), card = $('card'), urlEl = $('url');
  const layers = {};
  for (const [key, p] of Object.entries(PAGES)) {
    const layer = document.createElement('div'); layer.className = 'page'; layer.style.width = '1440px'; layer.style.height = p.h + 'px';
    const img = new Image(); img.src = p.src; img.alt = ''; img.decoding = 'async'; img.width = 1440; img.height = p.h;
    layer.appendChild(img); pagesEl.appendChild(layer); layers[key] = layer;
  }
  const typedFields = {};
  for (const [key, f] of Object.entries(FIELDS)) {
    const el = document.createElement('div'); el.className = 'typed';
    Object.assign(el.style, { left: f.x + 'px', top: f.y + 'px', width: f.w + 'px', height: f.h + 'px' });
    layers[key].appendChild(el); typedFields[key] = el;
  }

  // Fit the 1920×1080 stage into the window.
  function fit() {
    const frame = $('frame'); const s = Math.min(frame.clientWidth / 1920, frame.clientHeight / 1080);
    stage.style.transform = `translate(${-960 * s}px, ${-540 * s}px) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const cam = {}; // last camera per page
  function camera(step) {
    const p = PAGES[step.page], s = BASE * step.zoom, f = step.focus;
    let tx = W / 2 - (f.x + f.w / 2) * s, ty = H / 2 - (f.y + f.h / 2) * s;
    const pw = 1440 * s, ph = p.h * s;
    tx = pw <= W ? (W - pw) / 2 : Math.min(0, Math.max(W - pw, tx));
    ty = ph <= H ? 0 : Math.min(0, Math.max(H - ph, ty));
    return { s, tx, ty };
  }
  const toScreen = (c, r) => ({ x: r.x * c.s + c.tx, y: r.y * c.s + c.ty, w: r.w * c.s, h: r.h * c.s });
  const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

  function place(layer, c, animate) {
    layer.classList.toggle('no-move', !animate);
    layer.style.transform = `translate(${c.tx}px, ${c.ty}px) scale(${c.s})`;
    if (!animate) void layer.offsetWidth;
    layer.classList.remove('no-move');
  }
  function showHighlight(step, c) {
    hl.classList.remove('on'); tag.classList.remove('on');
    if (!step.hl) return;
    const r = toScreen(c, step.hl);
    Object.assign(hl.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    tag.textContent = step.tag || '';
    const above = r.y > 70;
    // Right-aligned above the frame: the left side usually holds the page heading.
    const tw = Math.min(420, 30 + (step.tag || '').length * 10.5);
    tag.style.left = Math.max(12, Math.min(W - tw - 12, r.x + r.w - tw)) + 'px';
    tag.style.top = (above ? r.y - 52 : r.y + r.h + 14) + 'px';
  }
  function storyFor(step) {
    if (step.card) return '';
    const flow = step.flow ? `<div class="flow">${step.flow.map(f => `<span>${f}</span>`).join('<i aria-hidden="true">→</i>')}</div>` : '';
    return `<p class="eyebrow">Глава ${step.ch} из 9 · ${CHAPTERS[step.ch]}</p><h2>${step.title}</h2><p>${step.text}</p>` + flow + (step.facts ? `<div class="facts">${step.facts.map(f => `<span>${f}</span>`).join('')}</div>` : '');
  }
  let urlTimer;
  function setUrl(url, animate) {
    clearInterval(urlTimer);
    const host = 'archive-vko', full = url;
    if (!animate || reduce) { urlEl.innerHTML = `<b>${host}</b>${full}`; return; }
    let k = 0; urlEl.innerHTML = `<b>${host}</b><span class="caret"></span>`;
    urlTimer = setInterval(() => { k++; urlEl.innerHTML = `<b>${host}</b>${full.slice(0, k)}<span class="caret"></span>`; if (k >= full.length) { clearInterval(urlTimer); setTimeout(() => urlEl.innerHTML = `<b>${host}</b>${full}`, 500); } }, 28);
  }
  let typeTimer, cycleTimer;
  function typeInto(el, text, done) {
    clearInterval(typeTimer); el.classList.add('on');
    if (reduce) { el.textContent = text; done?.(); return; }
    let k = 0; el.innerHTML = '<span class="caret"></span>';
    typeTimer = setInterval(() => { k++; el.innerHTML = text.slice(0, k) + '<span class="caret"></span>'; if (k >= text.length) { clearInterval(typeTimer); done?.(); } }, 95);
  }
  function cycleWords(el, words) {
    let n = 0; const nextWord = () => typeInto(el, words[n++ % words.length], () => { cycleTimer = setTimeout(nextWord, 1500); });
    nextWord();
  }
  function clearTyped() { clearInterval(typeTimer); clearTimeout(cycleTimer); for (const el of Object.values(typedFields)) { el.classList.remove('on'); el.textContent = ''; } }
  async function clickAt(pageKey, pt) {
    let c = cam[pageKey];
    // The click target may be outside the current shot (e.g. the header after scrolling down): pan to it first.
    if (pt.x * c.s + c.tx < 20 || pt.x * c.s + c.tx > W - 20 || pt.y * c.s + c.ty < 20 || pt.y * c.s + c.ty > H - 20) {
      const ph = PAGES[pageKey].h * c.s;
      const ty = ph <= H ? 0 : Math.min(0, Math.max(H - ph, H * 0.3 - pt.y * c.s));
      c = { ...c, ty }; cam[pageKey] = c; place(layers[pageKey], c, true); await wait(1250);
    }
    const x = pt.x * c.s + c.tx, y = pt.y * c.s + c.ty;
    cursor.classList.add('on'); cursor.style.left = (x - 6) + 'px'; cursor.style.top = (y - 4) + 'px';
    await wait(950);
    const r = document.createElement('div'); r.className = 'ripple'; r.style.left = x + 'px'; r.style.top = y + 'px'; view.appendChild(r); setTimeout(() => r.remove(), 800);
    await wait(380);
  }

  // Progress segments
  const progress = $('progress');
  STEPS.forEach((s, i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-label', s.card === 'intro' ? 'Начало' : s.card === 'outro' ? 'Финал' : `Глава ${s.ch}: ${CHAPTERS[s.ch]}`); b.addEventListener('click', e => { e.stopPropagation(); go(i, false); }); progress.appendChild(b); });

  let cur = -1, busy = false;
  async function go(i, animate = true) {
    if (i < 0 || i >= STEPS.length || busy || i === cur) return;
    busy = true;
    const prev = STEPS[cur], step = STEPS[i], forward = i === cur + 1;
    story.classList.add('out'); hl.classList.remove('on'); tag.classList.remove('on');
    if (animate && forward && prev && step.via) await clickAt(prev.page, step.via);
    clearTyped();
    const c = camera(step); const layer = layers[step.page];
    const samePage = prev && prev.page === step.page;
    if (!samePage) {
      Object.values(layers).forEach(l => l.classList.remove('active'));
      place(layer, c, false); layer.classList.add('active');
      setUrl(step.url, animate);
      if (prev) cursor.style.left = cursor.style.left; // keep cursor where it clicked
    } else {
      place(layer, c, animate);
      if (prev.url !== step.url) setUrl(step.url, false);
    }
    cam[step.page] = c;
    card.innerHTML = step.card ? CARDS[step.card] : ''; card.classList.toggle('on', !!step.card);
    // The cursor is only shown while it clicks; it fades out once the next view is on screen.
    if (step.card || !(animate && forward && step.via)) cursor.classList.remove('on'); else setTimeout(() => cursor.classList.remove('on'), reduce ? 0 : 900);
    [...progress.children].forEach((b, k) => { b.classList.toggle('now', k === i); b.classList.toggle('done', k < i); b.setAttribute('aria-selected', String(k === i)); });
    cur = i;
    await wait(samePage && animate ? 600 : 250);
    story.innerHTML = storyFor(step); void story.offsetWidth; story.classList.remove('out');
    await wait(samePage && animate ? 650 : 350);
    showHighlight(step, c); void hl.offsetWidth;
    if (step.hl) { hl.classList.add('on'); await wait(250); tag.classList.add('on'); }
    const field = typedFields[step.page];
    if (field && step.type) { if (!forward || !animate) { field.classList.add('on'); field.textContent = step.type; } else typeInto(field, step.type); }
    if (field && step.cycle) cycleWords(field, step.cycle);
    busy = false;
  }
  // After the last slide the tour starts again from the first one.
  const next = () => go(cur >= STEPS.length - 1 ? 0 : cur + 1), back = () => go(cur - 1, false);

  // Controls: keys, click on stage, buttons, autoplay, fullscreen.
  stage.addEventListener('keydown', e => {
    if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); back(); }
    else if (e.key === 'Home') { e.preventDefault(); go(0, false); }
    else if (e.key.toLowerCase() === 'f' || e.key.toLowerCase() === 'а') toggleFull();
  });
  document.addEventListener('keydown', e => { if (document.activeElement === document.body) { stage.focus(); stage.dispatchEvent(new KeyboardEvent('keydown', { key: e.key })); } });
  stage.addEventListener('click', e => { if (!e.target.closest('button')) { stage.focus(); next(); } });
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); back(); });
  let autoTimer = null; const play = $('play');
  play.addEventListener('click', e => {
    e.stopPropagation();
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; play.setAttribute('aria-pressed', 'false'); return; }
    play.setAttribute('aria-pressed', 'true');
    if (cur >= STEPS.length - 1) go(0, false);
    autoTimer = setInterval(() => { if (!busy) next(); }, 5200);
  });
  function toggleFull() {
    const el = $('frame');
    try { (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.())?.catch?.(() => {}); } catch { /* fullscreen not available here */ }
  }
  $('full').addEventListener('click', e => { e.stopPropagation(); toggleFull(); });
  document.addEventListener('fullscreenchange', () => { $('full').textContent = document.fullscreenElement ? 'Выйти из полного экрана' : 'На весь экран'; setTimeout(fit, 50); });

  // Start on the intro card; the first frame is complete without any interaction.
  go(0, false); stage.focus({ preventScroll: true });
})();
</script>
